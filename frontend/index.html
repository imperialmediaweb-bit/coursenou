<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="description" content="CourseBit - Generate complete AI-powered courses in minutes with Gemini and GPT-4o" />
    <title>CourseBit - AI Course Generator</title>
    <style>
      /* Painted before any JS runs, so a slow or failed boot shows the app's
         own dark surface instead of a blank white page. */
      html, body { margin: 0; background: #0F1117; color: #B4B8CC; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #boot .ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(108, 71, 255, 0.25); border-top-color: #6C47FF;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot .stuck { display: none; text-align: center; max-width: 22rem; padding: 0 1.5rem; }
      #boot .stuck p { margin: 0 0 1rem; font-size: 14px; line-height: 1.7; }
      #boot .stuck button {
        font: inherit; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
        background: #6C47FF; border: 0; border-radius: 12px; padding: 10px 20px;
      }
      #boot.is-stuck .ring { display: none; }
      #boot.is-stuck .stuck { display: block; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="ring"></div>
        <div class="stuck">
          <p>This is taking longer than usual. The app may have been updated while your tab was open.</p>
          <button id="boot-reload" type="button">Reload</button>
        </div>
      </div>
    </div>
    <script>
      // Bound here rather than as an onclick attribute — the site's
      // Content-Security-Policy sets script-src-attr 'none', which blocks
      // every inline handler.
      document.getElementById('boot-reload').addEventListener('click', function () {
        sessionStorage.removeItem('coursbit:chunk-reloaded');
        location.reload();
      });

      // If React has not replaced #boot within 12s, something failed to load.
      // Offer a reload rather than leaving the user on an empty screen.
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (boot) boot.className = 'is-stuck';
      }, 12000);
    </script>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; text-align: center">
        CourseBit needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
